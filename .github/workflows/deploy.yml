name: deploy to builds

on:
  workflow_run:
    workflows: [test build]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to builds branch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Checkout builds branch
        run: |
          git fetch origin builds 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/builds; then
            git checkout builds
          else
            git checkout -B builds
          fi

      - name: Remove existing files
        run: |
          rm -rf .gitignore .gitattributes README.md LICENSE package.json bun.lockb 2>/dev/null || true
          rm -rf .github .forgejo .zed .vscode *.* 2>/dev/null || true
          rm -rf node_modules src shims scripts 2>/dev/null || true

      - name: Copy build files
        run: |
          cp -r dist/* ./
          rm -rf dist info.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy build from ${{ github.event.workflow_run.head_sha }}"
            git push origin builds --force
          fi
